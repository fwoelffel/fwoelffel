version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/site'
    schedule:
      interval: 'daily'
    ignore:
      # @astrojs/check only accepts TypeScript 5 or 6 (peer dependency).
      # Remove once it supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
