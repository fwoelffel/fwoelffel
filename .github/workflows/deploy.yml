name: Build & deploy

on:
  push:
    paths: ['site/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/deploy.yml']
  # Lets the auto-merge job redeploy main: merges made with GITHUB_TOKEN
  # don't trigger push workflows, but a dispatch does.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The repository root is the GitHub profile (README.md); the site lives in site/.
defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist/
          # Keep .nojekyll: without it Pages runs Jekyll and drops _astro/.
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/
      # Pages serves the gh-pages branch (repository setting); dist/ carries the CNAME.
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          single-commit: true
          commit-message: 'chore: deploy ${{ github.sha }}'

  automerge:
    name: Auto-merge Dependabot
    needs: build
    # Only Dependabot PRs, and only once the build above is green.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    defaults:
      run:
        working-directory: .
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Patch and minor updates merge on their own; majors wait for a human.
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
